[project]
name = "ycappuccino-ui-shell"
version = "0.1.0"
description = "YCappuccino ui-shell: renders a ycappuccino-ui Screen as a real terminal app (textual)"
requires-python = ">=3.10"
dependencies = [
    "ycappuccino-ui",
    "textual>=0.60",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ycappuccino.ui_shell"
module-root = "src/main/python"

[tool.uv.sources]
ycappuccino-ui = { path = "../ui", editable = true }
